<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a50017"><title>Instalá La Barraca Shop</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#7d1024,#101116 65%);color:white;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{max-width:430px;width:100%;text-align:center;background:#191b23;border:1px solid #59505b;border-radius:24px;padding:28px 22px;box-shadow:0 20px 60px #0007}.logo{font-size:52px}h1{font-size:35px;margin:6px 0;color:#fff}p{line-height:1.5;color:#e4e4e8}.btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin:13px 0;font-weight:800;font-size:17px;color:white;background:#e91523;text-decoration:none;cursor:pointer}.alt{background:#303440;border:1px solid #777}#help{font-size:14px;color:#f2d6b0;min-height:45px}small{color:#b5b8c1}</style></head><body><main class="panel"><div class="logo">🎉🛍️</div><h1>La Barraca Shop</h1><p>¡Tené nuestro cotillón, repostería y juguetería siempre a mano!</p><button id="install" class="btn">📲 Instalar La Barraca</button><p id="help">Instalá el acceso a nuestra tienda en tu celular.</p><a class="btn alt" href="./index.html">🛒 Entrar a comprar sin instalar</a><small>San Javier, Santa Fe · Instalación gratuita</small></main><script>let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('help').textContent='¡Tu dispositivo permite instalar la aplicación!';});document.getElementById('install').onclick=async()=>{const help=document.getElementById('help');if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;await p.prompt();return;}if(/iPad|iPhone|iPod/.test(navigator.userAgent)){help.textContent='En iPhone: abrí esta página en Safari, tocá Compartir y elegí Agregar a pantalla de inicio.';}else{help.textContent='En Android: abrí la tienda en Chrome, tocá el menú ⋮ y elegí Instalar aplicación o Agregar a pantalla principal. Si estás dentro de WhatsApp, abrí el enlace en Chrome.';}};if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
